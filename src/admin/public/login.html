<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login · PDF API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(255,255,255,0.04);
      --border: rgba(148,163,184,0.18);
      --text: #e8eef7;
      --muted: #93a4bd;
      --accent: #3b82f6;
      --accent-2: #60a5fa;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Instrument Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(59,130,246,0.28), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(14,165,233,0.14), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .mark {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--accent), #93c5fd);
    }
    .brand span {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(2,8,20,0.55);
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus {
      border-color: rgba(59,130,246,0.7);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { filter: brightness(1.06); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.35);
      color: #fecaca;
      font-size: 13px;
    }
    .error.show { display: block; }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
    }
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="brand"><span class="mark"></span><span>PDF API Admin</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage keys, templates, usage, and settings.</p>
    <div class="error" id="error"></div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required placeholder="admin@pdfapi.local" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
    <button type="submit" id="submit">Sign in</button>
    <p class="hint">Use ADMIN_EMAIL / ADMIN_PASSWORD from your .env</p>
  </form>
  <script>
    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.classList.remove("show");
      submit.disabled = true;
      submit.textContent = "Signing in…";
      try {
        const res = await fetch("/admin/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.success) {
          throw new Error(json?.error?.message || "Login failed");
        }
        window.location.href = "/admin";
      } catch (err) {
        error.textContent = err.message || "Login failed";
        error.classList.add("show");
        submit.disabled = false;
        submit.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
